<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HocVu AI · Tra cứu quy chế đào tạo có dẫn nguồn</title>
    <meta name="description" content="HocVu AI giúp sinh viên tra cứu quy chế đào tạo, mỗi câu trả lời dẫn về điều, khoản cụ thể." />
    <meta name="theme-color" content="#f5f0e6" />
    <meta property="og:title" content="HocVu AI" />
    <meta property="og:description" content="Tra cứu quy chế đào tạo, mỗi câu trả lời dẫn về điều, khoản cụ thể." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      try {
        var t = localStorage.getItem('hv_theme');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
