[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "MasterStupid", email = "143319746+MasterStupid@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "edge-tts>=7.0.0",
    "fastapi>=0.115.0",
    "h11>=0.16.0",
    "httpx>=0.28.1",
    "idna>=3.15",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24.0",
    "pypdf>=6.21.1",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.32",
    "replit-object-storage>=1.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
